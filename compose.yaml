services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    ports:
      # Loopback only: the database must not be reachable from other hosts.
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_DB:
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
