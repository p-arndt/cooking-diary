name: Release

# Tag pushes only. `stamp release` (or `just release`) writes the version into
# package.json, commits, tags `v<x.y.z>` and pushes; this workflow publishes. It
# never decides a version.
#
# The shared container-release workflow checks the tag against package.json, pushes
# ghcr.io/<owner>/cooking-diary:<version> (plus <major>.<minor> and latest unless it
# is a pre-release) and creates the GitHub release with git-cliff notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    uses: p-arndt/.github/.github/workflows/container-release.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      image: cooking-diary
      # linux/amd64 only; add arm64 the day a host needs it.
      platforms: linux/amd64
      cache: gha
      verify-tag: true
      changelog: git-cliff
      cliff-config: cliff.toml
