name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    uses: p-arndt/.github/.github/workflows/sveltekit-ci.yml@v1
    with:
      # svelte-check imports the Paraglide messages, which the vite plugin only
      # generates during dev/build; compile them up front.
      setup-command: pnpm exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide
      # The client project has no tests yet and would need a Playwright browser.
      # Integration tests start Postgres through Testcontainers on the runner's Docker.
      test-command: pnpm vitest --run --project server --project integration
      build: true

  e2e:
    # Kept local: the shared workflow has no step for installing a browser, and the suite
    # needs the runner's Docker for the throwaway Postgres.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
