product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  - $libs.coil.compose
  - $libs.coil.network.ktor3
  - $libs.kotlinx.datetime
  - $libs.multiplatform.settings.noarg
  - $libs.filekit.dialogs.compose

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.okhttp
  - $libs.androidx.activity.compose

dependencies@ios:
  - $libs.ktor.client.darwin

settings:
  kotlin:
    serialization: json
    optIns:
      - kotlin.time.ExperimentalTime
      - androidx.compose.material3.ExperimentalMaterial3Api
  compose:
    enabled: true
    resources:
      packageName: de.parndt.cooking_diary.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
